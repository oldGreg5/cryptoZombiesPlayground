[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
gas_reports = ["ZombieOwnership", "ZombieHelper", "ZombieFeeding", "ZombieFactory", "ZombieAttack"]

[fuzz]
runs = 5

[invariant]
runs = 256
depth = 50
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"